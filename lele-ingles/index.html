<body>
<div id="gate" style="position:fixed;inset:0;z-index:50;background:linear-gradient(rgba(10,12,11,.82),rgba(10,12,11,.92)),url(vd-temporadas.jpg) center/cover no-repeat #0d110f;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));font-family:Nunito,'Segoe UI',system-ui,sans-serif;color:#f1ecdf">
  <form id="gate-form" style="width:100%;max-width:360px;background:rgba(28,36,32,.92);border:2px solid #c8323f;border-radius:20px;padding:24px 20px;display:grid;gap:14px">
    <img src="vd-logo.png" alt="The Vampire Diaries" style="display:block;width:230px;max-width:80%;height:auto;margin:0 auto">
    <h1 style="margin:0;font-family:Cinzel,Georgia,serif;font-weight:700;color:#ec8e96;font-size:1.3rem;text-align:center">Diários da Lelê</h1>
    <p style="margin:0;color:#b4b2c9;text-align:center">Diga a senha para entrar em Mystic Falls.</p>
    <label for="gate-user" style="font-weight:800">Login</label>
    <input id="gate-user" name="username" autocomplete="username" autocapitalize="none" style="font:inherit;font-size:1.1rem;padding:12px;border-radius:12px;border:2px solid #3a4373;background:#1b2140;color:#f1ecdf">
    <label for="gate-pass" style="font-weight:800">Senha</label>
    <input id="gate-pass" name="password" type="password" autocomplete="current-password" autocapitalize="none" style="font:inherit;font-size:1.1rem;padding:12px;border-radius:12px;border:2px solid #3a4373;background:#1b2140;color:#f1ecdf">
    <button type="submit" style="font:inherit;font-weight:800;font-size:1.1rem;padding:12px;border:none;border-radius:12px;background:#c8323f;color:#fff;cursor:pointer">Entrar</button>
    <p id="gate-msg" aria-live="polite" style="margin:0;min-height:1.4em;color:#ff8a7a;font-weight:700;text-align:center"></p>
    <button type="button" id="gate-guest" style="font:inherit;font-weight:800;font-size:1rem;padding:12px;border:2px solid #3a4373;border-radius:12px;background:transparent;color:#f1ecdf;cursor:pointer">Entrar como visitante</button>
    <p style="margin:0;color:#b4b2c9;font-size:.9rem;text-align:center">O visitante pode experimentar tudo. Os pontos zeram ao sair.</p>
  </form>
</div>
<script>
(function(){
  var USERS={"bb5ffa5cd72eddeb816b771f74db2447dc6fea8b997d1bd359f8c5a92756d9b6":"lele","ec023674eae9c3bf4b8e61ebdeced39c44cdb8934fcf23f1d4c52cb658d815d5":"admin","039e8936199a9965ca48850b6075bd5690ad0c10096ca5d4cb03468521477207":"visitante"}, gate=document.getElementById("gate");
  window.MAGIA_USER=null;
  try{ var saved=localStorage.getItem("lele-gate"); if(saved && USERS[saved]){ window.MAGIA_USER=USERS[saved]; gate.remove(); return; } }catch(e){}
  async function hash(t){ var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)); return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join(""); }
  document.getElementById("gate-guest").addEventListener("click",function(){
    var g=Object.keys(USERS).find(function(k){return USERS[k]==="visitante"});
    try{ localStorage.setItem("lele-gate",g); }catch(e){}
    window.MAGIA_USER="visitante"; location.reload();
  });
  document.getElementById("gate-form").addEventListener("submit",async function(e){
    e.preventDefault();
    var u=document.getElementById("gate-user").value.trim().toLowerCase(), p=document.getElementById("gate-pass").value.trim().toLowerCase();
    var h=""; try{ h=await hash(u+":"+p); }catch(err){}
    if(USERS[h]){
      try{ localStorage.setItem("lele-gate",h); if(USERS[h]==="admin"){ localStorage.setItem("lele-painel", await hash("painel:"+p)); } }catch(e){}
      location.reload();
    }
    else { document.getElementById("gate-msg").textContent="Login ou senha errados. Tente de novo."; }
  });
})();
</script>
<title>Escola de Magia da Lelê</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English+SC&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: uma noite no castelo — mapa de salas (aulas) que abre em cartões de pergaminho escuro; um feitiço de treino em tela cheia quando ela erra */
:root{
  --bg:#121629; --sky:#1b2140; --card:#232a4d; --card2:#2c3560;
  --ink:#f1ecdf; --muted:#b4b2c9; --gold:#e8b44a; --gold-soft:#f3d48e;
  --ok:#6fd3a0; --bad:#ff8a7a; --line:#3a4373;
  --display:"IM Fell English SC", Georgia, "Times New Roman", serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:680px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:20px 8px;flex-wrap:wrap}
.points{display:flex;align-items:center;gap:8px;background:var(--sky);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-variant-numeric:tabular-nums}
.points b{color:var(--gold)}
.brand{font-family:var(--display);font-size:1.15rem;color:var(--gold-soft)}

.hero{padding-block:18px 22px}
.hero h1{font-size:clamp(2.1rem,7vw,3.2rem);line-height:1.05;color:var(--gold)}
.hero p{color:var(--muted);max-width:52ch;margin:10px 0 0}

.rooms{display:grid;gap:12px}
.room{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:transform .15s,border-color .15s}
.room:hover{transform:translateY(-2px);border-color:var(--gold)}
.room .num{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;background:var(--sky);border:2px solid var(--line);color:var(--gold-soft)}
.room.done .num{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.room h3{font-size:1.25rem}
.room small{color:var(--muted);display:block;font-size:.9rem}
.room .tag{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.room.done .tag{color:var(--gold)}
.room.exam{background:linear-gradient(135deg,var(--card2),var(--card));border-color:var(--gold)}
.room > div{min-width:0}

.houses{display:grid;gap:10px;margin-bottom:18px}
.houses .lbl{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.house-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.house{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:800;text-align:left}
.house:hover{border-color:var(--gold)}
.house.on{border-color:var(--gold);background:var(--card2)}
.house .sw{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.35)}
.install{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start;margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.install img{border-radius:14px}
.install h3{font-size:1.35rem;color:var(--gold)}
.install p{margin:4px 0 10px;color:var(--muted)}
.install .how{color:var(--ink);margin:0}
.install > div{min-width:0}
/* Mystic Falls: névoa de floresta no lugar das estrelas */
html.vd #stars{display:none}
html.vd body{background:
  radial-gradient(120% 60% at 15% 0%, color-mix(in srgb,var(--ink) 9%,transparent), transparent 60%),
  radial-gradient(90% 50% at 90% 10%, color-mix(in srgb,var(--ink) 6%,transparent), transparent 65%),
  linear-gradient(180deg, color-mix(in srgb,var(--gold) 7%,var(--bg)) 0%, var(--bg) 45%);
  background-attachment:fixed; background-color:var(--bg)}
html.vd .hero h1{letter-spacing:.02em}
html.vd .brand{letter-spacing:.06em}
.cover{margin:0 0 14px;border-radius:16px;overflow:hidden;position:relative;border:1px solid var(--line);max-width:460px}
.cover img{display:block;width:100%;height:auto;aspect-ratio:12/5;object-fit:cover;object-position:center 22%}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,var(--bg))}
.seasons{margin:22px auto 0;max-width:340px;display:grid;gap:8px;text-align:center}
.seasons img{width:100%;height:auto;border-radius:14px;border:1px solid var(--line)}
.seasons figcaption{color:var(--muted);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
.room .season-img{grid-column:1/-1;width:100%;height:auto;display:block;border-radius:8px;aspect-ratio:798/100;object-fit:cover}
.lesson-season{display:block;width:100%;max-width:560px;height:auto;border-radius:10px;border:1px solid var(--line);margin:4px 0 10px;aspect-ratio:798/100;object-fit:cover}
/* ---------- animações ---------- */
html.vd .hero{text-align:center}
html.vd .hero p{margin-inline:auto}
.vd-logo{display:block;width:min(400px,88%);height:auto;margin:6px auto 14px;animation:logoIn 1.3s ease-out both, logoGlow 4.5s ease-in-out 1.3s infinite}
@keyframes logoIn{from{opacity:0;transform:scale(.9) translateY(8px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes logoGlow{50%{filter:drop-shadow(0 0 16px color-mix(in srgb,var(--gold) 60%,transparent))}}
.journey{display:grid;gap:6px;margin-top:16px}
.journey small{color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;width:100%;max-width:420px}
html.vd .bar{margin:0 auto}
.bar span{display:block;height:100%;width:var(--p);background:linear-gradient(90deg,var(--gold),var(--gold-soft));border-radius:5px;animation:fill 1.4s cubic-bezier(.2,.8,.2,1) .3s both}
@keyframes fill{from{width:0}}
.rooms .room{overflow:hidden;animation:rise .55s ease-out both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.room .season-img{transition:transform .6s ease}
.room:hover .season-img,.room:focus-visible .season-img{transform:scale(1.05)}
.room:active{transform:scale(.98)}
.house,.world,.opt,.chip,.btn{transition:transform .15s,background-color .2s,border-color .2s}
.house:active,.opt:active:not(:disabled),.chip:active,.btn:active{transform:scale(.95)}
.ex{animation:rise .4s ease-out both}
.lesson-season{animation:rise .5s ease-out both}
.opt.right{animation:pop .45s}
.opt.wrong,.line.shake{animation:shake .45s}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.feedback:not(:empty){animation:rise .3s ease-out both}
.progress span{transition:background-color .3s}
.progress span.now{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.dots span.on{animation:pop .35s}
.points.bump{animation:bump .55s}
@keyframes bump{35%{transform:scale(1.2)}}
.done-card .big{animation:medal 1s cubic-bezier(.2,1.5,.4,1) both}
@keyframes medal{from{transform:scale(0) rotate(-200deg)}}
.drill:not([hidden]) .drill-box{animation:rise .35s ease-out both}
.spark{position:fixed;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--gold-soft);border-radius:2px;transform:rotate(45deg);pointer-events:none;z-index:40;animation:spark .95s ease-out forwards}
.spark:nth-child(3n){background:var(--gold);width:6px;height:6px}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(260deg) scale(.2);opacity:0}}
.float-pts{position:fixed;transform:translate(-50%,0);font-weight:800;font-size:1.25rem;color:var(--gold);pointer-events:none;z-index:40;animation:floatup 1.2s ease-out forwards;text-shadow:0 2px 8px var(--bg)}
@keyframes floatup{to{transform:translate(-50%,-70px);opacity:0}}
/* ---------- aula mais visual + sangue lúdico (Mystic Falls) ---------- */
.explain,.ex{position:relative}
.lead{display:grid;gap:10px}
.lead p{margin:0;font-size:1.15rem;line-height:1.45;animation:rise .5s ease-out both;animation-delay:calc(var(--k,0) * 160ms)}
.lead p:first-child{font-size:1.35rem;font-weight:800;line-height:1.3}
.lead b{display:inline-block;padding:1px 10px;border-radius:999px;background:color-mix(in srgb,var(--gold) 24%,transparent);color:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);animation:pillGlow 2.6s ease-in-out infinite}
@keyframes pillGlow{50%{box-shadow:0 0 14px color-mix(in srgb,var(--gold) 55%,transparent)}}
.cola-title{font-size:.85rem;font-weight:800;color:var(--gold-soft)}
.cola-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px}
.tile{display:grid;gap:2px;align-content:start;text-align:left;background:var(--sky);border:2px solid var(--line);border-radius:12px;padding:10px 12px;animation:rise .45s ease-out both;animation-delay:calc(var(--k,0) * 60ms)}
.tile b{font-size:1.2rem;color:var(--gold-soft);line-height:1.2}
.tile span{color:var(--muted);font-size:.92rem}
.tile:hover{border-color:var(--gold)}
html.vd .tile:hover{box-shadow:0 0 16px color-mix(in srgb,var(--gold) 40%,transparent)}
.tile.hit{animation:pop .4s}
.ex .kind{font-size:.9rem;font-weight:800;color:var(--gold-soft);letter-spacing:.1em;text-transform:uppercase}
.ex .inst{font-family:var(--display);font-size:clamp(1.5rem,5.5vw,2rem);color:var(--gold);line-height:1.1;margin-top:-8px}
.ex .q{font-size:clamp(1.6rem,6vw,2rem)}
.ex .tr{font-size:1.08rem;color:var(--ink);opacity:.85}
.ex .tr b{font-size:.75rem;letter-spacing:.08em;padding:2px 8px;border-radius:6px;background:var(--line);color:var(--muted);margin-right:6px;vertical-align:2px}
html.vd .explain,html.vd .ex{padding-top:76px}
html.vd .lesson-head h2{text-shadow:0 0 22px color-mix(in srgb,var(--gold) 50%,transparent)}
/* gotas escorrendo do topo dos cartões */
.drips{--blood:#b51624;position:absolute;left:14px;right:14px;top:0;height:0;pointer-events:none;z-index:2}
.drips img{position:absolute;left:-16px;width:calc(100% + 32px);height:78px;top:-10px;object-fit:fill;transform-origin:top;animation:bleed 1.1s cubic-bezier(.3,.9,.3,1) both;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
@keyframes bleed{from{transform:scaleY(.15);opacity:.4}}
.drips i{position:absolute;top:calc(28px + var(--len));width:var(--w);height:0}
.drips i::after{content:"";position:absolute;left:50%;top:calc(100% - 4px);width:calc(var(--w) * .8);height:calc(var(--w) * 1.05);margin-left:calc(var(--w) * -.4);background:var(--blood);border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;animation:fall 3.4s ease-in var(--d) infinite}
@keyframes drip{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
@keyframes fall{0%,55%{transform:translateY(-6px) scale(.6);opacity:0}62%{opacity:1;transform:translateY(0) scale(1)}100%{transform:translateY(70px) scale(.8);opacity:0}}
/* moldura de sangue no Ritual de Treino e na medalha */
html.vd .drill-box,html.vd .done-card{background:url(vd-sangue-topo.png) top center/100% auto no-repeat,url(vd-sangue-base.png) bottom center/100% auto no-repeat,var(--card);padding-top:max(96px,28%);padding-bottom:56px;border-color:#b51624}
html.vd .drill-box h3,html.vd .done-card h3{text-shadow:0 2px 10px var(--bg),0 0 2px var(--bg)}
html.vd .drill:not([hidden]) .drill-box{animation:rise .35s ease-out both,frameIn 1s cubic-bezier(.3,.9,.3,1) both}
@keyframes frameIn{from{background-size:100% 20%,100% auto,auto}}
.drill{overflow-y:auto}
/* gotinha pingando da lacuna */
html.vd .ex .q .blank{position:relative}
html.vd .ex .q .blank::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:10px;margin-left:-4px;background:#b51624;border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;animation:fall 2.2s ease-in infinite}
/* respingo na resposta errada */
html.vd .opt.wrong{position:relative;isolation:isolate;overflow:hidden}
html.vd .opt.wrong::after{content:"";position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;z-index:-1;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 50% 50%,#b51624 0 18%,transparent 19%),radial-gradient(circle at 30% 38%,#b51624 0 7%,transparent 8%),radial-gradient(circle at 70% 62%,#b51624 0 8%,transparent 9%),radial-gradient(circle at 64% 30%,#b51624 0 4%,transparent 5%),radial-gradient(circle at 34% 68%,#b51624 0 5%,transparent 6%);
  opacity:.55;animation:splat .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes splat{from{transform:translate(-50%,-50%) scale(0)}}
/* faíscas viram gotas de sangue com gravidade */
html.vd .spark{background:#d21f2f;width:10px;height:10px;border-radius:50% 0 50% 50%;animation-name:bloodspark;animation-duration:1.15s;animation-timing-function:cubic-bezier(.2,.7,.4,1)}
html.vd .spark:nth-child(3n){background:#ff5a67;width:7px;height:7px}
@keyframes bloodspark{55%{transform:translate(var(--dx),var(--dy)) rotate(200deg)}100%{transform:translate(var(--dx),calc(var(--dy) + 80px)) rotate(260deg) scale(.5);opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* névoa andando em Mystic Falls */
html.vd body::after{content:"";position:fixed;inset:-25%;pointer-events:none;z-index:0;
  background:radial-gradient(38% 22% at 25% 35%, color-mix(in srgb,var(--ink) 8%,transparent), transparent 70%),
             radial-gradient(32% 18% at 75% 65%, color-mix(in srgb,var(--ink) 6%,transparent), transparent 70%),
             radial-gradient(28% 16% at 50% 90%, color-mix(in srgb,var(--gold) 6%,transparent), transparent 70%);
  animation:fog 38s ease-in-out infinite alternate}
@keyframes fog{to{transform:translate(9%,-4%)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.worlds{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--sky);border:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.world{border:none;background:transparent;border-radius:999px;padding:8px 16px;font-weight:800;color:var(--muted)}
.world.on{background:var(--gold);color:var(--bg)}
.world:not(.on):hover{color:var(--ink)}
.ex .tr{margin:0;color:var(--muted);font-size:1rem}
.qa-item .trq{color:var(--muted);font-size:.92rem}
.drill-tr{margin:0;color:var(--muted)}
.medals{margin-top:26px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.medals .lbl{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:100%}
.medal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);color:var(--line);font-family:var(--display);font-size:1.1rem}
.medal.on{border:2px solid var(--gold);background:radial-gradient(circle at 35% 30%,var(--gold-soft),var(--gold));color:var(--bg)}

.back{background:none;border:none;color:var(--muted);padding:6px 0;font-weight:600}
.back:hover{color:var(--gold)}
.lesson-head{padding-block:6px 14px}
.eyebrow{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.lesson-head h2{font-size:clamp(1.8rem,6vw,2.5rem);color:var(--ink)}
.explain{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:12px}
.explain p{margin:0}
.cola{width:100%;border-collapse:collapse;font-size:.98rem}
.cola td{padding:6px 8px;border-top:1px solid var(--line)}
.cola td:first-child{font-weight:800;color:var(--gold-soft);white-space:nowrap}
.cola-wrap{overflow-x:auto}
.cola-title{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.progress{display:flex;gap:4px;margin:18px 0 10px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress span.ok{background:var(--ok)}
.progress span.bad{background:var(--bad)}
.progress span.now{background:var(--gold)}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;font-weight:800;font-size:1.1rem}

.line{min-height:58px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.line.empty::before{content:"Toque nas palavras na ordem certa";color:var(--muted);font-size:.95rem;padding-left:4px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:800}
.chip:hover{border-color:var(--gold)}

.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--gold);color:var(--bg);border:none;border-radius:12px;padding:12px 20px;font-weight:800;font-size:1.05rem}

.feedback{font-weight:800}
.feedback.ok{color:var(--ok)}

.talk p{margin:0;color:var(--muted)}
.qa{display:grid;gap:10px}
.qa-item{background:var(--sky);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.qa-item .ask{font-weight:800;font-size:1.15rem}
.qa-item .ans{color:var(--ok);font-weight:600}
.qa-item .mini{display:flex;gap:8px;flex-wrap:wrap}
.small{font-size:.9rem;padding:6px 12px;border-radius:10px}

.done-card .big{width:84px;height:84px;font-size:2rem}

.drill{position:fixed;inset:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.drill-right{margin:0;color:var(--ok);font-weight:800}
.drill-sentence.chain{display:grid;gap:4px;font-size:clamp(1.4rem,6vw,2rem);padding:14px 12px}
.drill-sentence{font-size:clamp(1.6rem,7vw,2.4rem);font-weight:800;line-height:1.2;background:var(--sky);border-radius:14px;padding:18px 12px;overflow-wrap:anywhere}

/* ---------- jornada enviada para a planilha da Bia ---------- */
const LOG_URL = "https://script.google.com/macros/s/AKfycbxCIbN-lxke6PPEQLG7S_jt34aL6GjMExFCQZZL8UxPq0ADF9jc1wEX3yWGIC71wu_tmA/exec";
function logEvent(ev){
  if(!LOG_URL || !window.MAGIA_USER || IS_GUEST) return;
  let q=[]; try{ q=JSON.parse(localStorage.getItem("lele-fila")||"[]"); }catch(e){}
  q.push(Object.assign({user:window.MAGIA_USER, pontos:state.points}, ev));
  try{ localStorage.setItem("lele-fila",JSON.stringify(q.slice(-50))); }catch(e){}
  flushLog();
}
async function flushLog(){
  if(!LOG_URL || !navigator.onLine) return;
  let q=[]; try{ q=JSON.parse(localStorage.getItem("lele-fila")||"[]"); }catch(e){}
  while(q.length){
    try{ await fetch(LOG_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(q[0])}); }
    catch(e){ break; }
    q.shift(); try{ localStorage.setItem("lele-fila",JSON.stringify(q)); }catch(e){}
  }
}
addEventListener("online",flushLog);

/* ---------- voz ---------- */
let hasVoice=false; try{ hasVoice = !!(window.speechSynthesis && window.SpeechSynthesisUtterance); }catch(e){}
function speak(text){
  if(!hasVoice) return;
  let speechSynthesis; try{ speechSynthesis = window.speechSynthesis; }catch(e){ return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/→/g,","));
    u.lang = "en-US"; u.rate = .85;
    const v = speechSynthesis.getVoices().find(v=>/^en(-|_)US/i.test(v.lang)) || speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

async function loadPanel(){
  const out=document.getElementById("painel-out");
  let key=null; try{ key=localStorage.getItem("lele-painel"); }catch(e){}
  if(!LOG_URL){ out.innerHTML="<p>O painel ainda não está ligado à planilha.</p>"; return; }
  if(!key){ out.innerHTML="<p>Toque em Sair e entre de novo como admin para liberar o painel.</p>"; return; }
  out.innerHTML="<p>Buscando a jornada...</p>";
  let data;
  try{ const r=await fetch(LOG_URL+"?key="+encodeURIComponent(key)); data=await r.json(); }
  catch(e){ out.innerHTML="<p>Não consegui buscar agora. Confira a internet e tente de novo.</p>"; return; }
  if(data.erro){ out.innerHTML="<p>A planilha recusou o acesso. Toque em Sair e entre de novo como admin.</p>"; return; }
  const rows=data.rows||[];
  if(!rows.length){ out.innerHTML="<p>A Lelê ainda não terminou nenhuma aula.</p>"; return; }
  const last=rows[rows.length-1];
  const salas=new Set(rows.filter(r=>r.tipo==="aula").map(r=>r.sala));
  const exams=rows.filter(r=>r.tipo==="exame");
  const errs={};
  rows.forEach(r=>String(r.detalhe||"").split(" | ").filter(Boolean).forEach(t=>{ const k=t.replace(/ \(respondeu:.*\)$/,""); errs[k]=(errs[k]||0)+1; }));
  const top=Object.entries(errs).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const fmt=d=>{ try{ return new Date(d).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch(e){ return d; } };
  out.innerHTML=`
    <div class="qa-item"><span class="ask">${last.pontos} pontos · ${salas.size} aulas feitas · ${exams.length} exame(s)</span>
      <span>Última atividade: ${esc(fmt(last.quando))}</span></div>
    ${top.length?`<div class="qa-item"><span class="ask">O que ela mais erra</span>${top.map(([t,n])=>`<span>${esc(t)} <b style="color:var(--bad)">${n}x</b></span>`).join("")}</div>`:""}
    <div class="qa-item"><span class="ask">Últimas atividades</span>
      ${rows.slice(-10).reverse().map(r=>`<span>${esc(fmt(r.quando))} · ${esc(r.sala)}: <b>${r.acertos} de ${r.total}</b></span>`).join("")}</div>`;
}

let run = null; // {lesson, items, i, results, exam}

function startLesson(id){
  const lesson = LESSONS.find(l=>l.id===id);
  run = {lesson, items:lesson.ex.slice(), i:0, results:[], wrong:[], exam:false, intro:true};
  renderRun();
}
function startExam(){
  const all = LESSONS.flatMap(l=>l.ex.map(e=>e));
  const pick = shuffle(all).slice(0,10);
  run = {lesson:{id:"exam",title:W().exam}, items:pick, i:0, results:[], wrong:[], exam:true, intro:false};

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function fullSentence(ex){
  if(ex.w) return ex.w.join(" ");
  if(ex.pt){ return ex.q.split(":")[0].replace(" quer dizer","") + " = " + ex.a; }
  return ex.q.replace(/\s*\((.*?)\)\s*/g," ").replace("___",ex.a).trim();
}

function renderExercise(){
  const ex = run.items[run.i];
  const slot = document.getElementById("slot");
  const n = `${isVD()?"Desafio":"Feitiço"} ${run.i+1} de ${run.items.length}`;
  if(ex.w){
    const bank = shuffle(ex.w.map((t,k)=>({t,k})));

      <div class="row"><button class="btn" id="check" type="button" disabled>Conferir</button><button class="btn ghost" id="clear" type="button">Limpar</button></div>
      <div class="feedback" id="fb" aria-live="polite"></div></div>`;
    const line = document.getElementById("line"), chosen=[];
    const checkBtn = document.getElementById("check");
    const sync=()=>{ line.classList.toggle("empty",!chosen.length); checkBtn.disabled = chosen.length!==ex.w.length; };
    slot.querySelectorAll("#bank .chip").forEach(c=>c.onclick=()=>{
      if(c.classList.contains("used")) return;
      c.classList.add("used"); chosen.push(c);
      const t=document.createElement("button"); t.type="button"; t.className="chip"; t.textContent=c.textContent;
      t.onclick=()=>{ const i=chosen.indexOf(c); chosen.splice(i,1); c.classList.remove("used"); t.remove(); sync(); };
      line.appendChild(t); sync();
    });
    document.getElementById("clear").onclick=()=>{ chosen.length=0; line.innerHTML=""; slot.querySelectorAll("#bank .chip").forEach(c=>c.classList.remove("used")); sync(); };
    checkBtn.onclick=()=>{
      const said = chosen.map(c=>c.textContent).join(" ");
      const right = said===ex.w.join(" ");
      slot.querySelectorAll("button").forEach(b=>b.disabled=true);
      answer(right, said);
    };
  } else {
    const q = esc(ex.q).replace("___",'<span class="blank">?</span>');
    slot.innerHTML = `<div class="ex">${isVD()?DRIPS(7):""}<span class="kind">${n}</span><span class="inst">Escolha a resposta</span>
      <div class="q">${q}</div>${ex.tr?`<p class="tr"><b>PT</b>${esc(ex.tr)}</p>`:""}
      <div class="opts">${shuffle(ex.o).map(o=>`<button class="opt" type="button" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
      <div class="feedback" id="fb" aria-live="polite"></div></div>`;
    slot.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const right = b.dataset.o===ex.a;
      slot.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(x.dataset.o===ex.a) x.classList.add("right"); });
      if(!right) b.classList.add("wrong");
      const blank = slot.querySelector(".blank"); if(blank) blank.textContent = ex.a;
      answer(right, ex.q.replace("___",b.dataset.o));
    });
  }
}

let RM=false; try{ RM = matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
function DRIPS(n){
  let h="";
  for(let i=0;i<n;i++){
    const l=Math.round(i*(96/n)+Math.random()*5), w=8+Math.round(Math.random()*9), len=10+Math.round(Math.random()*22), d=(Math.random()*3).toFixed(2);
    h+=`<i style="left:${l}%;--w:${w}px;--len:${len}px;--d:${d}s"></i>`;
  }
  return `<div class="drips" aria-hidden="true"><img src="vd-sangue-faixa.png" alt="">${h}</div>`;
}
function burst(el, n){
  if(RM || !el) return;
  const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<n;i++){
    const s=document.createElement("span"); s.className="spark";
    const a=Math.random()*6.283, d=45+Math.random()*80;
    s.style.left=cx+"px"; s.style.top=cy+"px";
    s.style.setProperty("--dx",(Math.cos(a)*d)+"px"); s.style.setProperty("--dy",(Math.sin(a)*d)+"px");
    s.style.animationDelay=Math.round(Math.random()*90)+"ms";
    document.body.appendChild(s); setTimeout(()=>s.remove(),1200);
  }
}
function floatPts(el, txt){
  if(RM || !el) return;
  const r=el.getBoundingClientRect(), s=document.createElement("span");
  s.className="float-pts"; s.textContent=txt; s.style.left=(r.left+r.width/2)+"px"; s.style.top=(r.top-6)+"px";

}
function bumpPoints(){ const p=document.querySelector(".points"); if(!p) return; p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump"); }
const PRAISE = ["Excelente!","Feitiço perfeito!","Isso aí"+(IS_GUEST?"":", "+PLAYER)+"!","Mandou bem!","Brilhante!"];
function answer(right, said){

/* ---------- feitiço de treino: 5 repetições seguidas ---------- */
const drill = document.getElementById("drill");
let drillDone=null, drillCount=0, drillText="", drillTarget="", drillFails=0, micBlocked=false, listening=false;
let SR=null; try{ SR = window.SpeechRecognition || window.webkitSpeechRecognition || null; }catch(e){}

function words(t){
  return t.toLowerCase().replace(/[’`]/g,"'").replace(/\.\.\./g," ").replace(/[^a-z' ]+/g," ").split(/\s+/).filter(Boolean);
}
/* nomes próprios (Hermione, Hagrid...) costumam ser mal entendidos: não contam */
function targetWords(t){
  if(t.includes(" = ")) return words(t.split(" = ")[0]);
  return t.replace(/→/g," ").split(/[\s,]+/).filter(w=>w && !(/^[A-Z][a-z]/.test(w) && w!=="I" && !/^(Do|Does|Are|Is|Was|Were|Can|Where|What|Who|How|When|Why|Which|My|The|She|He|It|We|They|You|Yesterday)$/.test(w.replace(/[^A-Za-z]/g,"")))).flatMap(words);
}
function matches(heard, target){
  const need = targetWords(target); if(!need.length) return true;
  const pool = words(heard); let hit=0;
  for(const w of need){ const i=pool.indexOf(w); if(i>=0){ hit++; pool.splice(i,1); } }
  return hit >= Math.max(1, Math.ceil(need.length*0.75));
}
function setStatus(msg, cls){ const el=document.getElementById("drill-status"); el.textContent=msg; el.className="mic-status"+(cls?" "+cls:""); }
function micUsable(){ return !!SR && !micBlocked; }

function listen(){
  if(!micUsable() || listening || drillCount>=5) return;
  let rec; try{ rec = new SR(); }catch(e){ micBlocked=true; updateDrill(); return; }
  rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=4; rec.continuous=false;
  listening=true; const mic=document.getElementById("drill-mic"); mic.classList.add("listening"); mic.textContent="Ouvindo...";
  setStatus("Pode falar!","");
  let got=false;
  rec.onresult=e=>{
    got=true;
    const alts=[...e.results[0]].map(a=>a.transcript);
    if(alts.some(a=>matches(a,drillTarget))){
      drillCount++; drillFails=0;
      setStatus(drillCount>=5?"Perfeito! 5 de 5.":"Isso! Ouvi direitinho. "+drillCount+" de 5.","ok");
    } else {
      drillFails++;
      setStatus("Entendi: \""+alts[0]+"\". Tenta de novo, devagar.","bad");
    }
    updateDrill();
  };
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){ micBlocked=true; setStatus("O microfone está bloqueado. Use o botão Falei!.","bad"); }
    else if(e.error==="no-speech"){ drillFails++; setStatus("Não ouvi nada. Toque em Falar agora e fale mais alto.","bad"); }
    else if(e.error==="network"){ micBlocked=true; setStatus("A voz não funciona neste navegador. Use o botão Falei!.","bad"); }
    else { drillFails++; setStatus("Não deu pra ouvir. Tenta de novo.","bad"); }
  };
  rec.onend=()=>{ listening=false; mic.classList.remove("listening"); updateDrill(); };
  try{ rec.start(); }catch(e){ listening=false; micBlocked=true; updateDrill(); }
}
function openDrill(text, said, then, chain){
  drillDone=then; drillCount=0; drillFails=0;
  setStatus(micUsable()?"Toque em Falar agora ou, depois de falar, em Falei!.":"","");
  const box = document.getElementById("drill-sentence"), right = document.getElementById("drill-right");
  if(chain){
    drillText = chain.join(", "); drillTarget = chain.join(" ");
    box.classList.add("chain");
    box.innerHTML = chain.map(c=>`<span>${esc(c)}</span>`).join("");
    right.textContent = "Resposta certa: " + text; right.hidden = false;
  } else {
    drillText = text; drillTarget = text;
    box.classList.remove("chain");
    box.textContent = text;
    right.hidden = true;
  }
  document.getElementById("drill-yours").textContent = said ? "Você respondeu: " + said : "";
  updateDrill();
  document.getElementById("drill-listen").hidden = !hasVoice;
  drill.hidden=false;
  document.getElementById("drill-listen").focus();
  speak(drillText);
}
function updateDrill(){
  document.querySelectorAll("#drill-dots span").forEach((d,i)=>d.classList.toggle("on",i<drillCount));
  const said = document.getElementById("drill-said"), mic = document.getElementById("drill-mic");
  if(drillCount>=5){ said.textContent="Pronto! Continuar"; said.classList.remove("ghost"); mic.hidden=true; return; }
  said.innerHTML = `Falei! <span class="big-count">(${drillCount+1}/5)</span>`;
  said.classList.toggle("ghost", micUsable());
  mic.hidden = !micUsable();
  if(!listening) mic.innerHTML = `Falar agora <span class="big-count">(${drillCount+1}/5)</span>`;
}
document.getElementById("drill-listen").onclick=()=>speak(drillText);
document.getElementById("drill-mic").onclick=listen;
document.getElementById("drill-said").onclick=()=>{
  if(drillCount>=5){ drill.hidden=true; const f=drillDone; drillDone=null; f&&f(); return; }
  drillCount++; setStatus(drillCount>=5?"Muito bem! 5 de 5.":drillCount+" de 5. De novo!","ok"); updateDrill();
};
function norm(t){ return t.toLowerCase().replace(/[’`´]/g,"'").replace(/\.\.\./g," ").replace(/[^a-z0-9'à-ú ]+/g," ").replace(/\s+/g," ").trim(); }

try{(function(){
  const c=document.getElementById("stars"), x=c.getContext("2d"); if(!x) return;
  let reduce=false; try{ reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  let st=[];
  function size(){ c.width=innerWidth*devicePixelRatio; c.height=innerHeight*devicePixelRatio;
    st=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:(Math.random()*1.3+.3)*devicePixelRatio,p:Math.random()*6.28})); }
  function draw(t){ x.clearRect(0,0,c.width,c.height);
    for(const s of st){ const a=reduce?.6:.35+.45*Math.sin(t/900+s.p); x.fillStyle=`rgba(243,212,142,${a})`; x.beginPath(); x.arc(s.x,s.y,s.r,0,6.28); x.fill(); }
    if(!reduce) requestAnimationFrame(draw); }
