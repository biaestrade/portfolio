  <form id="gate-form" style="width:100%;max-width:360px;background:#232a4d;border:2px solid #e8b44a;border-radius:20px;padding:24px 20px;display:grid;gap:14px">

    <p id="gate-msg" aria-live="polite" style="margin:0;min-height:1.4em;color:#ff8a7a;font-weight:700;text-align:center"></p>

<script>
(function(){

  window.MAGIA_USER=null;
  try{ var saved=localStorage.getItem("lele-gate"); if(saved && USERS[saved]){ window.MAGIA_USER=USERS[saved]; gate.remove(); return; } }catch(e){}
  async function hash(t){ var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)); return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join(""); }
  document.getElementById("gate-form").addEventListener("submit",async function(e){
    e.preventDefault();
    var u=document.getElementById("gate-user").value.trim().toLowerCase(), p=document.getElementById("gate-pass").value.trim().toLowerCase();

  });
})();

<title>Escola de Magia da Lelê</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: uma noite no castelo — mapa de salas (aulas) que abre em cartões de pergaminho escuro; um feitiço de treino em tela cheia quando ela erra */
:root{
  --bg:#121629; --sky:#1b2140; --card:#232a4d; --card2:#2c3560;
  --ink:#f1ecdf; --muted:#b4b2c9; --gold:#e8b44a; --gold-soft:#f3d48e;
  --ok:#6fd3a0; --bad:#ff8a7a; --line:#3a4373;
  --display:"IM Fell English SC", Georgia, "Times New Roman", serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:680px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:20px 8px;flex-wrap:wrap}
.points{display:flex;align-items:center;gap:8px;background:var(--sky);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-variant-numeric:tabular-nums}
.points b{color:var(--gold)}
.brand{font-family:var(--display);font-size:1.15rem;color:var(--gold-soft)}

.hero{padding-block:18px 22px}
.hero h1{font-size:clamp(2.1rem,7vw,3.2rem);line-height:1.05;color:var(--gold)}
.hero p{color:var(--muted);max-width:52ch;margin:10px 0 0}

.rooms{display:grid;gap:12px}
.room{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:transform .15s,border-color .15s}
.room:hover{transform:translateY(-2px);border-color:var(--gold)}
.room .num{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;background:var(--sky);border:2px solid var(--line);color:var(--gold-soft)}
.room.done .num{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.room h3{font-size:1.25rem}
.room small{color:var(--muted);display:block;font-size:.9rem}
.room .tag{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.room.done .tag{color:var(--gold)}
.room.exam{background:linear-gradient(135deg,var(--card2),var(--card));border-color:var(--gold)}
.room > div{min-width:0}

.medals{margin-top:26px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.medals .lbl{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:100%}
.medal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);color:var(--line);font-family:var(--display);font-size:1.1rem}
.medal.on{border:2px solid var(--gold);background:radial-gradient(circle at 35% 30%,var(--gold-soft),var(--gold));color:var(--bg)}

.back{background:none;border:none;color:var(--muted);padding:6px 0;font-weight:600}
.back:hover{color:var(--gold)}
.lesson-head{padding-block:6px 14px}
.eyebrow{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.lesson-head h2{font-size:clamp(1.8rem,6vw,2.5rem);color:var(--ink)}
.explain{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:12px}
.explain p{margin:0}
.cola{width:100%;border-collapse:collapse;font-size:.98rem}
.cola td{padding:6px 8px;border-top:1px solid var(--line)}
.cola td:first-child{font-weight:800;color:var(--gold-soft);white-space:nowrap}
.cola-wrap{overflow-x:auto}
.cola-title{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.progress{display:flex;gap:4px;margin:18px 0 10px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress span.ok{background:var(--ok)}
.progress span.bad{background:var(--bad)}
.progress span.now{background:var(--gold)}

.ex{background:var(--sky);border:1px solid var(--line);border-radius:16px;padding:20px 18px;display:grid;gap:16px}
.ex .kind{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ex .q{font-size:1.45rem;font-weight:800;line-height:1.3}
.ex .q .blank{display:inline-block;min-width:3ch;border-bottom:3px solid var(--gold);color:var(--gold)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;font-weight:800;font-size:1.1rem}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.right{border-color:var(--ok);background:var(--card);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.wrong{border-color:var(--bad);background:var(--card);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.opt:disabled{cursor:default}

.line{min-height:58px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.line.empty::before{content:"Toque nas palavras na ordem certa";color:var(--muted);font-size:.95rem;padding-left:4px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:800}
.chip:hover{border-color:var(--gold)}
.chip.used{visibility:hidden}

.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--gold);color:var(--bg);border:none;border-radius:12px;padding:12px 20px;font-weight:800;font-size:1.05rem}
.btn:hover{background:var(--gold-soft)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.feedback{font-weight:800}
.feedback.ok{color:var(--ok)}
.feedback.bad{color:var(--bad)}

.talk{margin-top:6px;background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:18px;display:grid;gap:12px}
.talk h3{font-size:1.5rem;color:var(--gold)}
.talk p{margin:0;color:var(--muted)}
.qa{display:grid;gap:10px}
.qa-item{background:var(--sky);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.qa-item .ask{font-weight:800;font-size:1.15rem}
.qa-item .ans{color:var(--ok);font-weight:600}
.qa-item .mini{display:flex;gap:8px;flex-wrap:wrap}
.small{font-size:.9rem;padding:6px 12px;border-radius:10px}

.done-card{text-align:center;padding:26px 18px;background:var(--card);border:1px solid var(--gold);border-radius:16px;display:grid;gap:10px;justify-items:center}
.done-card .big{width:84px;height:84px;font-size:2rem}
.done-card h3{font-size:1.8rem;color:var(--gold)}

/* Feitiço de treino */
.drill{position:fixed;inset:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.drill-box{width:100%;max-width:560px;background:var(--card);border:2px solid var(--gold);border-radius:20px;padding:22px 18px;display:grid;gap:16px;text-align:center}
.drill-box h3{font-size:1.7rem;color:var(--gold)}
.drill-box .sub{color:var(--muted);margin:0}
.drill-right{margin:0;color:var(--ok);font-weight:800}
.drill-sentence.chain{display:grid;gap:4px;font-size:clamp(1.4rem,6vw,2rem);padding:14px 12px}
.drill-sentence{font-size:clamp(1.6rem,7vw,2.4rem);font-weight:800;line-height:1.2;background:var(--sky);border-radius:14px;padding:18px 12px;overflow-wrap:anywhere}
.dots{display:flex;justify-content:center;gap:10px}
.dots span{width:26px;height:26px;border-radius:50%;border:2px solid var(--line)}
.dots span.on{background:var(--gold);border-color:var(--gold)}
.drill-box .row{justify-content:center}
.type-row{display:grid;grid-template-columns:1fr auto;gap:8px;text-align:left}
.type-lbl{grid-column:1/-1;font-weight:700;color:var(--muted);font-size:.95rem}
#drill-input{font:inherit;font-size:1.1rem;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--sky);color:var(--ink);min-width:0}
#drill-input:focus{border-color:var(--gold);outline:none}
.mic-status{margin:0;min-height:1.5em;font-weight:600;color:var(--muted)}
.mic-status.ok{color:var(--ok)}
.mic-status.bad{color:var(--bad)}
#drill-mic.listening{background:var(--ok)}
.big-count{font-variant-numeric:tabular-nums}
.yours{color:var(--bad);font-size:.95rem;margin:0}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<canvas id="stars" aria-hidden="true"></canvas>
<main id="app"><p style="padding-top:40px;color:var(--muted)">Abrindo a Escola de Magia...</p></main>

<div class="drill" id="drill" hidden role="dialog" aria-modal="true" aria-labelledby="drill-title">
  <div class="drill-box">
    <h3 id="drill-title">Feitiço de Treino</h3>
    <p class="sub">Leia em voz alta e escreva tudo o que está no quadro. Repita 5 vezes seguidas.</p>
    <p class="yours" id="drill-yours"></p>
    <p class="drill-right" id="drill-right" hidden></p>
    <div class="drill-sentence" id="drill-sentence"></div>
    <div class="dots" id="drill-dots"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="row">
      <button class="btn ghost" id="drill-listen" type="button">Ouvir a pronúncia</button>
      <button class="btn" id="drill-mic" type="button" hidden>Falar agora</button>
      <button class="btn" id="drill-said" type="button" hidden>Pronto! Continuar</button>
    </div>
    <form class="type-row" id="drill-type" autocomplete="off">
      <label for="drill-input" class="type-lbl">Ou escreva o que está no quadro:</label>
      <input id="drill-input" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <button class="btn" id="drill-check" type="submit">Conferir</button>
    </form>
    <p class="mic-status" id="drill-status" aria-live="polite"></p>
  </div>
</div>

<script>
window.addEventListener("error",function(e){var a=document.getElementById("app");if(a&&!a.querySelector(".room,.ex,.done-card")){a.innerHTML='<p style="padding-top:40px">Ops, a página travou neste aparelho. Mande um print desta mensagem: '+String(e.message||e.error||"erro")+'</p>';}});
</script>

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function fullSentence(ex){
  if(ex.w) return ex.w.join(" ");
  if(ex.pt){ return ex.q.split(":")[0].replace(" quer dizer","") + " = " + ex.a; }
  return ex.q.replace(/\s*\((.*?)\)\s*/g," ").replace("___",ex.a).trim();
}

function renderRun(){

function renderExercise(){
  const ex = run.items[run.i];
  const slot = document.getElementById("slot");
  const n = `Feitiço ${run.i+1} de ${run.items.length}`;
  if(ex.w){
    const bank = shuffle(ex.w.map((t,k)=>({t,k})));
    slot.innerHTML = `<div class="ex"><span class="kind">${n} · Monte a frase</span>
      <div class="line empty" id="line"></div>
      <div class="bank" id="bank">${bank.map(b=>`<button class="chip" data-k="${b.k}" type="button">${esc(b.t)}</button>`).join("")}</div>
      <div class="row"><button class="btn" id="check" type="button" disabled>Conferir</button><button class="btn ghost" id="clear" type="button">Limpar</button></div>
      <div class="feedback" id="fb" aria-live="polite"></div></div>`;
    const line = document.getElementById("line"), chosen=[];
    const checkBtn = document.getElementById("check");
    const sync=()=>{ line.classList.toggle("empty",!chosen.length); checkBtn.disabled = chosen.length!==ex.w.length; };
    slot.querySelectorAll("#bank .chip").forEach(c=>c.onclick=()=>{
      if(c.classList.contains("used")) return;
      c.classList.add("used"); chosen.push(c);
      const t=document.createElement("button"); t.type="button"; t.className="chip"; t.textContent=c.textContent;
      t.onclick=()=>{ const i=chosen.indexOf(c); chosen.splice(i,1); c.classList.remove("used"); t.remove(); sync(); };
      line.appendChild(t); sync();
    });
    document.getElementById("clear").onclick=()=>{ chosen.length=0; line.innerHTML=""; slot.querySelectorAll("#bank .chip").forEach(c=>c.classList.remove("used")); sync(); };
    checkBtn.onclick=()=>{
      const said = chosen.map(c=>c.textContent).join(" ");
      const right = said===ex.w.join(" ");
      slot.querySelectorAll("button").forEach(b=>b.disabled=true);
      answer(right, said);
    };
  } else {
    const q = esc(ex.q).replace("___",'<span class="blank">?</span>');
    slot.innerHTML = `<div class="ex"><span class="kind">${n} · Escolha a resposta</span>
      <div class="q">${q}</div>
      <div class="opts">${shuffle(ex.o).map(o=>`<button class="opt" type="button" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
      <div class="feedback" id="fb" aria-live="polite"></div></div>`;
    slot.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const right = b.dataset.o===ex.a;
      slot.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(x.dataset.o===ex.a) x.classList.add("right"); });
      if(!right) b.classList.add("wrong");
      const blank = slot.querySelector(".blank"); if(blank) blank.textContent = ex.a;
      answer(right, ex.q.replace("___",b.dataset.o));
    });
  }
}

/* ---------- feitiço de treino: 5 repetições seguidas ---------- */
const drill = document.getElementById("drill");
let drillDone=null, drillCount=0, drillText="", drillTarget="", drillFails=0, micBlocked=false, listening=false;
let SR=null; try{ SR = window.SpeechRecognition || window.webkitSpeechRecognition || null; }catch(e){}

function words(t){
  return t.toLowerCase().replace(/[’`]/g,"'").replace(/\.\.\./g," ").replace(/[^a-z' ]+/g," ").split(/\s+/).filter(Boolean);
}
/* nomes próprios (Hermione, Hagrid...) costumam ser mal entendidos: não contam */
function targetWords(t){
  if(t.includes(" = ")) return words(t.split(" = ")[0]);
  return t.replace(/→/g," ").split(/[\s,]+/).filter(w=>w && !(/^[A-Z][a-z]/.test(w) && w!=="I" && !/^(Do|Does|Are|Is|Was|Were|Can|Where|What|Who|How|When|Why|Which|My|The|She|He|It|We|They|You|Yesterday)$/.test(w.replace(/[^A-Za-z]/g,"")))).flatMap(words);
}
function matches(heard, target){
  const need = targetWords(target); if(!need.length) return true;
  const pool = words(heard); let hit=0;
  for(const w of need){ const i=pool.indexOf(w); if(i>=0){ hit++; pool.splice(i,1); } }
  return hit >= Math.max(1, Math.ceil(need.length*0.75));
}
function setStatus(msg, cls){ const el=document.getElementById("drill-status"); el.textContent=msg; el.className="mic-status"+(cls?" "+cls:""); }
function micUsable(){ return !!SR && !micBlocked; }

function listen(){
  if(!micUsable() || listening || drillCount>=5) return;
  let rec; try{ rec = new SR(); }catch(e){ micBlocked=true; updateDrill(); return; }
  rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=4; rec.continuous=false;
  listening=true; const mic=document.getElementById("drill-mic"); mic.classList.add("listening"); mic.textContent="Ouvindo...";
  setStatus("Pode falar!","");
  let got=false;
  rec.onresult=e=>{
    got=true;
    const alts=[...e.results[0]].map(a=>a.transcript);
    if(alts.some(a=>matches(a,drillTarget))){
      drillCount++; drillFails=0;
      setStatus(drillCount>=5?"Perfeito! 5 de 5.":"Isso! Ouvi direitinho. "+drillCount+" de 5.","ok");
    } else {
      drillFails++;
      setStatus("Entendi: \""+alts[0]+"\". Tenta de novo, devagar.","bad");
    }
    updateDrill();
  };
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){ micBlocked=true; setStatus("O microfone está bloqueado. Escreva a frase no campo abaixo.","bad"); }
    else if(e.error==="no-speech"){ drillFails++; setStatus("Não ouvi nada. Toque em Falar agora e fale mais alto.","bad"); }
    else if(e.error==="network"){ micBlocked=true; setStatus("O microfone precisa de internet. Escreva a frase no campo abaixo.","bad"); }
    else { drillFails++; setStatus("Não deu pra ouvir. Tenta de novo.","bad"); }
  };
  rec.onend=()=>{ listening=false; mic.classList.remove("listening"); updateDrill(); };
  try{ rec.start(); }catch(e){ listening=false; micBlocked=true; updateDrill(); }
}
function openDrill(text, said, then, chain){
  drillDone=then; drillCount=0; drillFails=0; document.getElementById("drill-input").value="";
  setStatus(micUsable()?"Toque em Falar agora ou escreva o quadro no campo abaixo.":"","");
  const box = document.getElementById("drill-sentence"), right = document.getElementById("drill-right");
  if(chain){
    drillText = chain.join(", "); drillTarget = chain.join(" ");
    box.classList.add("chain");
    box.innerHTML = chain.map(c=>`<span>${esc(c)}</span>`).join("");
    right.textContent = "Resposta certa: " + text; right.hidden = false;
  } else {
    drillText = text; drillTarget = text;
    box.classList.remove("chain");
    box.textContent = text;
    right.hidden = true;
  }
  document.getElementById("drill-yours").textContent = said ? "Você respondeu: " + said : "";
  updateDrill();
  document.getElementById("drill-listen").hidden = !hasVoice;
  drill.hidden=false;
  document.getElementById("drill-listen").focus();
  speak(drillText);
}
function updateDrill(){
  document.querySelectorAll("#drill-dots span").forEach((d,i)=>d.classList.toggle("on",i<drillCount));
  const said = document.getElementById("drill-said"), mic = document.getElementById("drill-mic"), type = document.getElementById("drill-type");
  if(drillCount>=5){ said.hidden=false; mic.hidden=true; type.hidden=true; return; }
  said.hidden = true; type.hidden = false;
  document.getElementById("drill-check").textContent = `Conferir (${drillCount+1}/5)`;
  mic.hidden = !micUsable();
  if(!listening) mic.innerHTML = `Falar agora <span class="big-count">(${drillCount+1}/5)</span>`;
}
document.getElementById("drill-listen").onclick=()=>speak(drillText);
document.getElementById("drill-mic").onclick=listen;
document.getElementById("drill-said").onclick=()=>{
  if(drillCount>=5){ drill.hidden=true; const f=drillDone; drillDone=null; f&&f(); }
};
function norm(t){ return t.toLowerCase().replace(/[’`´]/g,"'").replace(/\.\.\./g," ").replace(/[^a-z0-9'à-ú ]+/g," ").replace(/\s+/g," ").trim(); }
document.getElementById("drill-type").addEventListener("submit",e=>{
  e.preventDefault();
  if(drillCount>=5) return;
  const inp=document.getElementById("drill-input"), typed=inp.value;
  if(!typed.trim()){ setStatus("Escreva o que está no quadro e toque em Conferir.","bad"); return; }
  if(norm(typed)===norm(drillTarget)){
    drillCount++; inp.value="";
    setStatus(drillCount>=5?"Perfeito! 5 de 5.":"Certinho! "+drillCount+" de 5. Agora de novo.","ok");
    updateDrill(); if(drillCount<5) inp.focus();
  } else {
    setStatus("Ainda não está igual ao quadro. Confira letra por letra.","bad");
  }
});

/* ---------- fim da aula ---------- */
function renderEnd(){
  const slot = document.getElementById("slot");
  const hits = run.results.filter(Boolean).length;
  const L = run.lesson;
  if(run.exam){
    const pass = hits>=7;
    if(pass){ state.done.exam=true; state.points+=50; save(); }
    logEvent({tipo:"exame",sala:"O Grande Exame",acertos:hits,total:run.items.length,detalhe:run.wrong.join(" | ")});
    slot.innerHTML = `<div class="done-card"><span class="medal big ${pass?"on":""}">★</span>
      <h3>${pass?"Aprovada no Grande Exame!":"Quase lá!"}</h3>
      <p>Você acertou ${hits} de ${run.items.length}.${pass?" Ganhou mais 50 pontos!":" Faça de novo: com 7 acertos você passa."}</p>
      <div class="row"><button class="btn" id="again" type="button">Fazer outro exame</button><button class="btn ghost" id="map" type="button">Voltar ao mapa</button></div></div>`;
    document.getElementById("again").onclick=startExam;
    document.getElementById("map").onclick=home;
    return;
  }
  const first = !state.done[L.id];
  if(first){ state.done[L.id]=true; state.points+=30; save(); }
  logEvent({tipo:"aula",sala:L.title,acertos:hits,total:run.items.length,detalhe:run.wrong.join(" | ")});
  const idx = LESSONS.indexOf(L);
  slot.innerHTML = `<div class="done-card"><span class="medal big on">${["I","II","III","IV","V","VI","VII"][idx]}</span>
      <h3>Medalha conquistada!</h3>
      <p>Você acertou ${hits} de ${run.items.length}.${first?" Ganhou mais 30 pontos!":""}</p></div>
    <div class="talk">
      <h3>Hora de conversar</h3>
      <p>Leia a pergunta em voz alta e responda falando, sem olhar. Depois toque em "Ver resposta" para conferir. Se quiser, pratique também com o Claude no modo de voz.</p>
      <div class="qa">${L.talk.map((t,k)=>`
        <div class="qa-item"><span class="ask">${esc(t[0])}</span>
          <span class="ans" id="ans${k}" hidden>${esc(t[1])}</span>
          <div class="mini">${hasVoice?`<button class="btn ghost small" data-say="${esc(t[0])}" type="button">Ouvir</button>`:""}
          <button class="btn ghost small" data-show="${k}" type="button">Ver resposta</button></div></div>`).join("")}
      </div>
      <div class="row"><button class="btn" id="map" type="button">Voltar ao mapa</button><button class="btn ghost" id="redo" type="button">Refazer esta aula</button></div>
    </div>`;
  slot.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
  slot.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{ document.getElementById("ans"+b.dataset.show).hidden=false; b.hidden=true; });
  document.getElementById("map").onclick=home;
  document.getElementById("redo").onclick=()=>startLesson(L.id);
  document.querySelector(".points b").textContent = state.points;
}

/* ---------- estrelas ---------- */
try{(function(){
  const c=document.getElementById("stars"), x=c.getContext("2d"); if(!x) return;
  let reduce=false; try{ reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  let st=[];
  function size(){ c.width=innerWidth*devicePixelRatio; c.height=innerHeight*devicePixelRatio;
    st=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:(Math.random()*1.3+.3)*devicePixelRatio,p:Math.random()*6.28})); }
  function draw(t){ x.clearRect(0,0,c.width,c.height);
    for(const s of st){ const a=reduce?.6:.35+.45*Math.sin(t/900+s.p); x.fillStyle=`rgba(243,212,142,${a})`; x.beginPath(); x.arc(s.x,s.y,s.r,0,6.28); x.fill(); }
    if(!reduce) requestAnimationFrame(draw); }
  size(); addEventListener("resize",()=>{size(); if(reduce) draw(0);}); requestAnimationFrame(draw);
})();}catch(e){}

if(hasVoice){ try{ window.speechSynthesis.getVoices(); }catch(e){} }
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",home); else home();
flushLog();
</script>
